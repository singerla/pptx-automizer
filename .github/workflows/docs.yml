# ROADMAP Phase 6.3: build the Docusaurus site (guides + typedoc API) and
# deploy it to GitHub Pages — the only docs host (ROADMAP 6.5 decision).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege for GITHUB_TOKEN: the build job only reads the checkout;
# the Pages write scopes are granted to the deploy job alone
permissions:
  contents: read

# one deployment at a time; don't cancel a production deploy mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            website/yarn.lock

      # the root install is needed too: typedoc resolves the library's
      # dependency types through the root node_modules
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd website install --frozen-lockfile

      - name: Build site
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to create the Pages deployment
      id-token: write # to request the OIDC token deploy-pages verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
