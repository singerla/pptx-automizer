# ROADMAP Phase 6.3: build the Docusaurus site (guides + typedoc API) and
# deploy it to GitHub Pages — the only docs host (ROADMAP 6.5 decision).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege for GITHUB_TOKEN: the build job only reads the checkout;
# the Pages write scopes are granted to the deploy job alone
permissions:
  contents: read

# one deployment at a time; don't cancel a production deploy mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            website/yarn.lock

      # the root install is needed too: typedoc resolves the library's
      # dependency types through the root node_modules
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd website install --frozen-lockfile

      - name: Build site
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to create the Pages deployment
      id-token: write # to request the OIDC token deploy-pages verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
