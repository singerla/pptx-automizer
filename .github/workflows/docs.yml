# ROADMAP Phase 6.3: build the Docusaurus site (guides + typedoc API) and
# deploy it to GitHub Pages — the only docs host (ROADMAP 6.5 decision).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a production deploy mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            website/yarn.lock

      # the root install is needed too: typedoc resolves the library's
      # dependency types through the root node_modules
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install website dependencies
        run: yarn --cwd website install --frozen-lockfile

      - name: Build site
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
